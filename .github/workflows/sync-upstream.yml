name: Sync with Upstream

on:
  schedule:
    # 毎日日本時間午前3時に実行
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync with upstream stable releases
        run: |
          # upstream追加
          git remote add upstream https://github.com/pmmp/PocketMine-MP.git || true
          git fetch upstream stable --tags
          
          # pmmp-admin-bot[bot]の最新コミットを検索
          SYNC_COMMIT=$(git log upstream/stable --author="pmmp-admin-bot\[bot\]" --grep="is next" --format="%H" -n 1)
          
          if [ -z "$SYNC_COMMIT" ]; then
            echo "No pmmp-admin-bot[bot] commit found"
            exit 0
          fi
          
          # 現在のcustomizeブランチに既に含まれているか確認
          if git merge-base --is-ancestor $SYNC_COMMIT customize; then
            echo "Already up to date with $SYNC_COMMIT"
            exit 0
          fi
          
          # customizeブランチに切り替え
          git checkout customize
          
          # マージ実行
          SYNC_MESSAGE=$(git log -1 --format="%s" $SYNC_COMMIT)
          git merge $SYNC_COMMIT -m "Sync with upstream: $SYNC_MESSAGE"
          
          # プッシュ
          git push origin customize