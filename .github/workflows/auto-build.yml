name: Auto Build Custom PocketMine-MP

on:
  push:
    branches:
      - customize  # customizeブランチへのpush
  pull_request:
    branches:
      - customize  # customizeブランチへのPR

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 全履歴取得（バージョン情報用）

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, mbstring, sqlite3, zip, zlib
          tools: composer
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php8.3-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php8.3-composer-

      - name: Install dependencies
        run: composer install --no-dev --classmap-authoritative --prefer-dist

      - name: Generate build info
        id: build-info
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +"%Y%m%d-%H%M%S")
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          
          # PRの場合はPR番号を含める
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBER="${{ github.event.number }}"
            BUILD_NAME="CustomPocketMine-PR${PR_NUMBER}-${BUILD_TIME}-${COMMIT_HASH}"
          else
            BUILD_NAME="CustomPocketMine-${BUILD_TIME}-${COMMIT_HASH}"
          fi
          
          echo "hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          echo "time=$BUILD_TIME" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "build_name=$BUILD_NAME" >> $GITHUB_OUTPUT

      - name: Build Phar
        id: build-phar
        run: |
          echo "Pharファイルビルド開始..."
          composer make-server --out "${{ steps.build-info.outputs.build_name }}.phar"
          
          # ファイルサイズ確認
          FILE_SIZE=$(du -h "${{ steps.build-info.outputs.build_name }}.phar" | cut -f1)
          echo "ビルド完了! ファイルサイズ: $FILE_SIZE"
          echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT

      - name: Test Phar execution
        run: |
          echo "Pharファイルのテスト実行..."
          php "${{ steps.build-info.outputs.build_name }}.phar" --version
          echo "Pharファイルが正常に実行されました"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.build-info.outputs.build_name }}"
          path: "${{ steps.build-info.outputs.build_name }}.phar"
          retention-days: 30

      # customizeブランチへのpush時のみリリース作成
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/customize'
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ steps.build-info.outputs.time }}"
          name: "Custom Build ${{ steps.build-info.outputs.time }}"
          body: |
            ## カスタムPocketMine-MPビルド
            
            ### ビルド情報
            - **ビルド時刻**: ${{ steps.build-info.outputs.time }} (UTC)
            - **コミット**: [`${{ steps.build-info.outputs.hash }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            - **ブランチ**: `${{ steps.build-info.outputs.branch }}`
            - **ファイルサイズ**: ${{ steps.build-phar.outputs.file_size }}
            - **PHP**: 8.3
            
            ---
            このリリースは自動生成されました
          files: "${{ steps.build-info.outputs.build_name }}.phar"
          draft: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # PRコメント（PR時のみ）
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const buildName = '${{ steps.build-info.outputs.build_name }}';
            const commitHash = '${{ steps.build-info.outputs.hash }}';
            const buildTime = '${{ steps.build-info.outputs.time }}';
            
            const comment = `## ビルド成功

            ### ビルド情報
            - **ファイル名**: \`${buildName}.phar\`
            - **コミット**: \`${commitHash}\`
            - **ビルド時刻**: ${buildTime} (UTC)
            - **PHP版本**: 8.3

            ### ダウンロード
            [Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) からダウンロードできます。

            ### テスト方法
            \`\`\`bash
            # ダウンロード後
            php ${buildName}.phar --version
            \`\`\`

            ---
            このコメントは自動生成されました`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      # ビルド完了通知
      - name: Build summary
        run: |
          echo "## ビルド完了" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 詳細情報" >> $GITHUB_STEP_SUMMARY
          echo "- **ファイル名**: \`${{ steps.build-info.outputs.build_name }}.phar\`" >> $GITHUB_STEP_SUMMARY
          echo "- **コミット**: \`${{ steps.build-info.outputs.hash }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **ビルド時刻**: ${{ steps.build-info.outputs.time }} (UTC)" >> $GITHUB_STEP_SUMMARY
          echo "- **PHP版本**: 8.3" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "### リリース作成" >> $GITHUB_STEP_SUMMARY
            echo "GitHubリリースが自動作成されました" >> $GITHUB_STEP_SUMMARY
          else
            echo "### PR情報" >> $GITHUB_STEP_SUMMARY
            echo "PRにコメントが投稿されました" >> $GITHUB_STEP_SUMMARY
          fi