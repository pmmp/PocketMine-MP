name: Auto Build Custom PocketMine-MP

on:
  push:
    branches:
      - customize
  pull_request:
    branches:
      - customize

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # PocketMine-MP公式Dockerイメージを使用
      image: ghcr.io/pmmp/pocketmine-mp:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install composer dependencies
        run: |
          cd /pocketmine
          composer install --no-dev --classmap-authoritative --prefer-dist

      - name: Generate build info
        id: build-info
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +"%Y%m%d-%H%M%S")
          BUILD_NAME="CustomPocketMine-${BUILD_TIME}-${COMMIT_HASH}"
          echo "build_name=$BUILD_NAME" >> $GITHUB_OUTPUT

      - name: Build Phar
        run: |
          cd /pocketmine
          composer make-server --out "${{ steps.build-info.outputs.build_name }}.phar"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.build-info.outputs.build_name }}"
          path: "/pocketmine/${{ steps.build-info.outputs.build_name }}.phar"
          retention-days: 30