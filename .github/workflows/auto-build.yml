name: Auto Build Custom PocketMine-MP

on:
  push:
    branches:
      - customize
  pull_request:
    branches:
      - customize

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PMMPのPHPバイナリをダウンロード
      - name: Download PMMP PHP Binary
        run: |
          echo "Downloading PHP 8.3 for PocketMine-MP 5..."
          curl -L "https://github.com/pmmp/PHP-Binaries/releases/download/pm5-php-8.3-latest/PHP-8.3-Linux-x86_64-PM5.tar.gz" -o php.tar.gz
          
          mkdir -p ./pmmp-php
          tar -xzf php.tar.gz -C ./pmmp-php
          
          # PHPバイナリのパスを設定（php7ディレクトリを想定）
          PHP_BINARY="./pmmp-php/bin/php7/bin/php"
          PHP_INI="./pmmp-php/bin/php7/bin/php.ini"
          
          # opcache拡張を無効化
          if [ -f "$PHP_INI" ]; then
            sed -i 's/^zend_extension=opcache.so/;zend_extension=opcache.so/' "$PHP_INI" || true
          fi
          
          chmod +x "$PHP_BINARY"
          PHP_BINARY_ABS=$(readlink -f "$PHP_BINARY")
          
          echo "PHP_BINARY=$PHP_BINARY_ABS" >> $GITHUB_ENV

      - name: Install Composer
        run: |
          curl -sS https://getcomposer.org/installer | ${{ env.PHP_BINARY }}
          mv composer.phar ./composer
          chmod +x ./composer
          echo "COMPOSER_BINARY=$(readlink -f ./composer)" >> $GITHUB_ENV

      - name: Get composer cache directory
        id: composer-cache
        run: |
          TEMP_FILE=$(mktemp)
          ${{ env.PHP_BINARY }} ${{ env.COMPOSER_BINARY }} config cache-files-dir > "$TEMP_FILE" 2>&1
          CACHE_DIR=$(grep -v "Warning:" "$TEMP_FILE" | tail -n1)
          rm -f "$TEMP_FILE"
          
          if [ -z "$CACHE_DIR" ]; then
            CACHE_DIR="$HOME/.cache/composer"
          fi
          
          echo "dir=$CACHE_DIR" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          ${{ env.PHP_BINARY }} ${{ env.COMPOSER_BINARY }} install --no-dev --classmap-authoritative --prefer-dist

      - name: Generate build info
        id: build-info
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          # JSTタイムゾーンで時刻を取得
          BUILD_TIME_JST=$(TZ=Asia/Tokyo date +"%Y%m%d-%H%M%S")
          BUILD_NAME="CustomPocketMine-${BUILD_TIME_JST}-${COMMIT_HASH}"
          
          echo "build_name=$BUILD_NAME" >> $GITHUB_OUTPUT
          echo "time_jst=$BUILD_TIME_JST" >> $GITHUB_OUTPUT

      - name: Build Phar
        id: build-phar
        run: |
          echo "Building Phar..."
          ${{ env.PHP_BINARY }} ${{ env.COMPOSER_BINARY }} make-server
          
          if [ -f "PocketMine-MP.phar" ]; then
            FILE_SIZE=$(du -h "PocketMine-MP.phar" | cut -f1)
            echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT
          else
            echo "Error: Phar file not created"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.build-info.outputs.build_name }}"
          path: "PocketMine-MP.phar"
          retention-days: 30

      # customizeブランチへのpush時のみリリース作成
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/customize'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ steps.build-info.outputs.time_jst }}"
          name: "Build ${{ steps.build-info.outputs.time_jst }}"
          body: |
            **ビルド時刻**: ${{ steps.build-info.outputs.time_jst }} (JST)
            **コミット**: ${{ github.sha }}
            **ファイルサイズ**: ${{ steps.build-phar.outputs.file_size }}
          files: "PocketMine-MP.phar"
          draft: false
          prerelease: false  # 正式リリースに変更
          make_latest: true   # 最新リリースとしてマーク
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}