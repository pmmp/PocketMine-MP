name: Auto Build Custom PocketMine-MP

on:
  push:
    branches:
      - customize
  pull_request:
    branches:
      - customize

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PMPのPHPバイナリをダウンロード
      - name: Download PMMP PHP Binary
        run: |
          # Linux x86_64用の最新PHPバイナリを取得
          PHP_VERSION=$(curl -s https://api.github.com/repos/pmmp/PHP-Binaries/releases/latest | jq -r .tag_name)
          echo "Downloading PHP $PHP_VERSION for PocketMine-MP"
          
          # PHPバイナリをダウンロード
          curl -L "https://github.com/pmmp/PHP-Binaries/releases/download/${PHP_VERSION}/PHP-Linux-x86_64-PM5.tar.gz" -o php.tar.gz
          
          # 展開
          mkdir -p ./bin/php
          tar -xzf php.tar.gz -C ./bin/php
          
          # 実行権限を付与
          chmod +x ./bin/php/bin/php
          
          # パスを設定
          echo "$(pwd)/bin/php/bin" >> $GITHUB_PATH

      - name: Verify PHP Installation
        run: |
          ./bin/php/bin/php -v
          ./bin/php/bin/php -m | grep -E "pmmpthread|leveldb|chunkutils2|crypto|morton"

      - name: Install Composer
        run: |
          curl -sS https://getcomposer.org/installer | ./bin/php/bin/php
          mv composer.phar ./bin/composer
          chmod +x ./bin/composer
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          ./bin/php/bin/php ./bin/composer install --no-dev --classmap-authoritative --prefer-dist

      - name: Generate build info
        id: build-info
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +"%Y%m%d-%H%M%S")
          BUILD_NAME="CustomPocketMine-${BUILD_TIME}-${COMMIT_HASH}"
          echo "build_name=$BUILD_NAME" >> $GITHUB_OUTPUT

      - name: Build Phar
        run: |
          ./bin/php/bin/php ./bin/composer make-server --out "${{ steps.build-info.outputs.build_name }}.phar"

      - name: Test Phar execution
        run: |
          ./bin/php/bin/php "${{ steps.build-info.outputs.build_name }}.phar" --version

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.build-info.outputs.build_name }}"
          path: "${{ steps.build-info.outputs.build_name }}.phar"
          retention-days: 30

      # 以下、リリース作成部分は同じ